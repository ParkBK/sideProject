<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>업무공간 · 시흥 청년문화예술공동체</title>
<!--
  임원 전용 업무공간
  - 이 페이지 주소를 알아도 로그인 + 임원(또는 회계 담당) 권한이 없으면 아무 데이터도 볼 수 없습니다.
    실제 차단은 데이터베이스 RLS 정책이 합니다 (supabase/schema.sql).
  - 홈페이지 메뉴에는 나오지 않고, 임원이 로그인하면 "업무공간" 버튼이 보입니다.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1c1e'/%3E%3Ccircle cx='24' cy='8' r='3.5' fill='%23ffc02e'/%3E%3Cpath d='M6 21c3-3 6-3 9 0s6 3 11 0' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--brand:#1847a4;--brand-dark:#0f3480;--brand-soft:#eaf0fb;--point:#ffc02e;--point-soft:#fff5d9;--ink:#1c1c1e;--ink2:#3d4046;--sub:#6b7078;--line:#e3e5e8;--soft:#f4f5f7;--red:#c62828;--red-soft:#fdecec;--green:#1b6b3a;--green-soft:#e8f5ec}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--soft);color:var(--ink);line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ul,ol{list-style:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--point);outline-offset:2px}
  input,select,textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #cfd3d8;border-radius:8px;background:#fff;color:var(--ink);width:100%}
  textarea{min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(24,71,164,.15)}
  input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--brand)}

  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:var(--ink);color:#fff}
  .top .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}
  .top .logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:11px}
  .top .tag{font-size:12px;font-weight:700;background:var(--point);color:var(--ink);padding:3px 8px;border-radius:4px}
  .top .me{margin-left:auto;font-size:14px;opacity:.85}
  .top a,.top button.lo{font-size:13.5px;padding:7px 12px;border-radius:6px;background:rgba(255,255,255,.1)}
  .top a:hover,.top button.lo:hover{background:rgba(255,255,255,.2)}
  @media(max-width:640px){.top .me,.top .tag{display:none}}

  .layout>*{min-width:0}
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
  .side button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:8px;font-size:15px;font-weight:600;color:var(--ink2);text-align:left}
  .side button:hover{background:var(--soft)}
  .side button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  .side button .n{margin-left:auto;font-size:12px;font-weight:800;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px}
  .side .sep{height:1px;background:var(--line);margin:10px 4px}
  @media(max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .side{position:sticky;top:60px;z-index:10;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
    .side button{width:auto;white-space:nowrap;padding:9px 12px;font-size:14px}
    .side .sep{display:none}
  }
  main{padding:28px;max-width:1200px;width:100%}
  @media(max-width:640px){main{padding:16px}}
  h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
  .lead{color:var(--sub);font-size:14.5px;margin-bottom:20px}
  .panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .panel+.panel{margin-top:16px}
  .panel h3{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border-radius:12px;padding:18px}
  .kpi p{font-size:13px;color:var(--sub);font-weight:600}
  .kpi b{display:block;margin-top:6px;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .kpi.warn b{color:var(--red)}
  .kpi.good b{color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-size:14.5px;font-weight:700;background:var(--brand);color:#fff;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn.w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.w:hover{box-shadow:inset 0 0 0 1px var(--ink)}
  .btn.s{height:32px;padding:0 10px;font-size:13px}
  .btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px #f0c4c4}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .form{display:grid;gap:12px}
  .form .f2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .form label{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink2)}
  .form .ck{display:flex;align-items:center;gap:8px;font-weight:600}
  .hint{font-size:12.5px;color:var(--sub);font-weight:400}
  .msg{padding:10px 12px;border-radius:8px;font-size:14px}
  .msg.err{background:var(--red-soft);color:var(--red)}
  .msg.ok{background:var(--green-soft);color:var(--green)}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
  .chip.y{background:var(--point-soft);color:#8a5a00}
  .chip.r{background:var(--red-soft);color:var(--red)}
  .chip.g{background:var(--green-soft);color:var(--green)}
  .chip.k{background:var(--soft);color:var(--ink2)}
  .empty{padding:28px;text-align:center;color:var(--sub);font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:var(--soft);font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
  td.num,th.num{text-align:right;white-space:nowrap}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* 할 일 */
  .tasks li{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tasks li input{margin-top:4px;width:18px;height:18px}
  .tasks .t{flex:1;min-width:0}
  .tasks .t b{font-weight:600}
  .tasks li.done .t b{text-decoration:line-through;color:var(--sub)}
  .tasks .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--sub)}
  .tasks .over{color:var(--red);font-weight:700}

  /* 달력 */
  .cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cal-h b{font-size:20px;font-weight:800;min-width:130px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cal .dw{padding:8px;font-size:12.5px;font-weight:700;color:var(--sub);background:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
  .cal .dw:first-child{color:var(--red)}
  .cal .d{min-width:0;overflow:hidden;min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;background:#fff;transition:background .15s;text-align:left}
  .cal .d:hover{background:var(--brand-soft)}
  .cal .d.out{background:#fafbfc;color:#b5bac1}
  .cal .d.today .dn{background:var(--brand);color:#fff;border-radius:50%}
  .cal .d.sel{box-shadow:inset 0 0 0 2px var(--brand)}
  .cal .dn{display:inline-grid;place-items:center;width:24px;height:24px;font-size:13px;font-weight:700}
  .cal .ev{display:block;margin-top:3px;font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal .ev.task{background:var(--point-soft);color:#7a5200}
  .cal .ev.task.dn2{background:var(--soft);color:var(--sub);text-decoration:line-through}
  @media(max-width:640px){.cal .d{min-height:56px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0;margin-top:2px}}

  /* 표식(책갈피) · 정기 업무 · 팝업 */
  .flag{display:inline-flex;align-items:center;gap:4px;margin-right:6px;padding:1px 7px 1px 6px;border-radius:4px;font-size:11.5px;font-weight:800;color:#fff;background:var(--fc);vertical-align:1px;white-space:nowrap}
  .flag::before{content:"";width:0;height:0;border-left:4px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.85}
  .tasks li[data-mk]{box-shadow:inset 4px 0 0 var(--fc);padding-left:12px}
  .hot{padding:12px 14px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:14px;margin-bottom:12px}
  .hot b{margin-right:6px}
  h4.sec{margin:18px 0 4px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:baseline}
  .periods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .per{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
  .per.now{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .per h4{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:baseline}
  .per .tasks li{padding:9px 2px;gap:8px}
  .per .tasks li[data-mk]{padding-left:10px}
  .empty.s{padding:10px;font-size:13px}
  table.mini{margin-top:8px;font-size:13px}
  table.mini th,table.mini td{padding:6px;text-align:center}
  table.mini td:first-child,table.mini th:first-child{text-align:left}
  table.matrix td,table.matrix th{text-align:center;padding:8px 6px}
  table.matrix td:first-child,table.matrix th:first-child{text-align:left;min-width:220px}
  table.matrix input{width:18px;height:18px}
  table.matrix td.late{background:var(--red-soft)}
  table.matrix td.na,table.mini td.na{color:#c3c7cc}
  .kpis.rt{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:4px 0 8px}
  .kpis.rt .kpi{border:1px solid var(--line)}
  table.matrix th.nowc{background:var(--brand-soft);color:var(--brand)}
  .tabs{gap:6px}
  .cal .ev.mk{background:color-mix(in srgb,var(--fc) 14%,#fff);color:var(--fc);box-shadow:inset 3px 0 0 var(--fc);font-weight:700}
  .cal .ev{cursor:pointer}
  .cal .ev:hover{filter:brightness(.95)}
  .cal .more{display:block;margin-top:3px;font-size:11.5px;color:var(--sub);font-weight:700}
  .cal-h .legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
  @media(max-width:640px){.cal .more{font-size:0}.cal .more::before{content:"…";font-size:12px}.cal-h .legend{display:none}}
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
  .modal-box{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:14px;padding:24px}
  .modal-x{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--sub)}
  .modal-x:hover{background:var(--soft)}
  .m-title{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em;word-break:break-word}
  .m-meta{color:var(--sub);font-size:14px}
  .m-memo{margin-top:12px;padding:12px;border-radius:8px;background:var(--soft);white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .m-edit{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .m-edit summary{cursor:pointer;font-weight:700;margin-bottom:10px}
  .modal .row{margin-top:14px}
  .gate{max-width:480px;margin:80px auto;padding:36px;background:#fff;border-radius:16px;text-align:center}
  .gate h1{font-size:22px;font-weight:800;margin-bottom:10px}
  .gate p{color:var(--sub);margin-bottom:18px}
  details.app{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
  details.app summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
  details.app dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:14px 0;font-size:14px}
  details.app dt{color:var(--sub);font-weight:600}

  /* 홈페이지 관리 */
  .li-item{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  .li-item+.li-item{margin-top:10px}
  .li-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .li-h b{margin-right:auto;font-size:14px}
  .ph-prev{display:flex;align-items:center;gap:10px}
  .ph-prev img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--soft)}
  .ph-prev label.btn{cursor:pointer}
  .st-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .st-row span{flex:1;min-width:0;font-weight:600}
  .st-row select{width:auto}
  .upd{font-size:12.5px;color:var(--sub);font-weight:400;margin-left:auto}
</style>
</head>
<body>

<div id="gate" class="gate"><h1>업무공간</h1><p>불러오는 중…</p></div>

<div id="app" hidden>
  <header class="top">
    <a class="logo" href="index.html"><i>시흥</i><span>업무공간</span></a>
    <span class="tag" id="roleTag"></span>
    <span class="me" id="meName"></span>
    <a href="index.html">홈페이지</a>
    <button type="button" class="lo" id="logout">로그아웃</button>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="업무 메뉴"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/sb.js"></script>
<script src="assets/site-data.js"></script>
<script src="assets/appdoc.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const TODAY = ymd(new Date());
  const fmt = s => s ? s.slice(0, 10).replaceAll("-", ".") : "";
  const won = n => (+n || 0).toLocaleString("ko-KR") + "원";
  const msg = (el, t, ok) => el.innerHTML = t ? `<p class="msg ${ok ? "ok" : "err"}">${h(t)}</p>` : "";
  const DONGS = ["대야동","신천동","은행동","과림동","신현동","매화동","연성동","장곡동","목감동","능곡동","군자동","월곶동","배곧1동","배곧2동","정왕본동","정왕1동","정왕2동","정왕3동","정왕4동","거북섬동"];
  let c, ME, OFF, ACC, OFFICERS = [];

  /* 운영 기본 체크리스트: 작은 비영리단체가 흔히 놓치는 일 */
  const STARTER = [
    ["회계연도 결산서 작성 (전년도)", "회계", null, "yearly", 31, 1],
    ["회원 명부 정비·연회비 납부 확인", "운영", null, "yearly", 31, 1],
    ["정기총회 개최 (결산 승인, 사업계획 보고)", "운영", null, "yearly", null, 2],
    ["정관 보완: 이해충돌·임원 보수·감사 조항", "행정", "2027-02-28"],
    ["홈페이지 결산 공개 (홈페이지에 약속한 일정)", "운영", null, "yearly", 30, 4],
    ["다음 해 사업계획·예산안 작성 (총회 안건 준비)", "운영", null, "yearly", 15, 12],
    ["비영리민간단체 등록 요건 점검 (활동 1년·회원 수)", "행정", "2027-07-02"],
    ["월별 장부 마감·영수증 대조 (매월)", "회계", null, "monthly", null],
    ["사례비 원천징수 신고·납부 (지급한 달의 다음 달 10일까지)", "회계", null, "monthly", 10],
    ["활동 종료 후 1주일 안에 활동 기록·사진 등록", "운영", null],
    ["사진 게시 전 초상권·법정대리인 동의 확인", "운영", null],
    ["운영회의 회의록 작성·보관", "운영", null],
    ["아동·청소년 프로그램 강사 범죄경력 조회 (배정 시)", "행정", null],
    ["탈퇴 회원·종료 사업 개인정보 파기 점검 (분기)", "행정", null, "quarterly", null],
    ["홈페이지 정보 점검: 연혁·사업·공지 (분기)", "홍보", null, "quarterly", null],
    ["월 운영회의 개최·회의록 공유", "운영", null, "monthly", null],
    ["분기 활동·예산 점검 (계획 대비 실적)", "운영", null, "quarterly", null],
  ];
  const TASK_CATS = ["운영", "회계", "행사", "홍보", "행정", "할 일"];
  const LEDGER_CATS = { "수입": ["회비", "보조금", "사업 수익", "후원금", "기타 수입"], "지출": ["강사료·사례비", "재료비", "대관료", "홍보비", "교통비", "식비", "운영비", "기타 지출"] };
  const ACT_TYPES = ["공연", "전시", "공공미술", "교육", "축제·행사", "콘텐츠", "생활문화", "봉사", "정책·행정", "기타"];

  /* ── 권한 확인 ── */
  async function boot() {
    const gate = $("#gate");
    if (!SB.configured) { gate.innerHTML = `<h1>업무공간</h1><p>데이터베이스가 아직 연결되지 않았습니다.<br>homepage/SETUP.md 순서대로 설정하세요.</p><a class="btn" href="index.html">홈페이지로</a>`; return; }

  const VIEWS = [
    ["dash", "대시보드", "🏠", () => OFF], ["cal", "달력", "📅", () => OFF], ["tasks", "할 일·체크리스트", "✅", () => OFF],
    ["acts", "활동 기록", "📍", () => OFF], ["site", "홈페이지 관리", "🛠", () => OFF], ["sep"], ["members", "가입 신청·회원", "👥", () => OFF], ["reports", "신고 처리", "🚩", () => OFF],

  async function buildSide() {

  /* ── 대시보드 ── */
  async function dash(el) {

  /* ── 할 일: 공통 ──
     정기 업무(repeat = monthly/quarterly)는 하나의 항목으로 두고, 달·분기마다 완료 여부를 task_checks에 따로 기록 */
  const MARKERS = { red: ["긴급", "#d93025"], orange: ["중요", "#e8710a"], green: ["진행 중", "#188038"], blue: ["참고", "#1a73e8"] };
  const MARK_ORDER = { red: 0, orange: 1, green: 2, blue: 3 };
  const markerSel = v => `<select name="marker"><option value="">표식 없음</option>${Object.entries(MARKERS).map(([k, [l]]) => `<option value="${k}" ${v === k ? "selected" : ""}>● ${l}</option>`).join("")}</select>`;
  const flag = m => m && MARKERS[m] ? `<span class="flag" style="--fc:${MARKERS[m][1]}">${MARKERS[m][0]}</span>` : "";
  const lastDay = (y, m) => new Date(y, m, 0).getDate();             /* m: 1~12 */
  const monthOf = d => d.slice(0, 7);
  const quarterOf = d => `${d.slice(0, 4)}-Q${Math.ceil(+d.slice(5, 7) / 3)}`;
  const periodFor = (t, d) => t.repeat === "monthly" ? monthOf(d) : t.repeat === "yearly" ? d.slice(0, 4) : quarterOf(d);
  const kindOf = p => p.length === 4 ? "yearly" : p.includes("Q") ? "quarterly" : "monthly";
  /* 정기 업무의 그 달·분기 마감일 (분기는 마지막 달) */
  function periodDue(t, period) {
    const y = +period.slice(0, 4), m = period.length === 4 ? (t.repeat_month || 12) : period.includes("Q") ? +period.slice(6) * 3 : +period.slice(5, 7);
    return `${y}-${pad(m)}-${pad(Math.min(t.repeat_day || lastDay(y, m), lastDay(y, m)))}`;
  }
  const dayLabel = t => t.repeat_day ? t.repeat_day + "일" : "말일";
  const repeatLabel = t => t.repeat === "monthly" ? `매월 ${dayLabel(t)}` : t.repeat === "quarterly" ? `분기 마지막 달 ${dayLabel(t)}` : t.repeat === "yearly" ? `매년 ${t.repeat_month || 12}월 ${dayLabel(t)}` : "";
  const periodName = p => p.length === 4 ? `${p}년` : p.includes("Q") ? `${p.slice(0, 4)}년 ${p.slice(6)}분기` : `${+p.slice(5, 7)}월`;
  async function loadTasks() {
    const [t, k] = await Promise.all([c.from("tasks").select("*").order("created_at"), c.from("task_checks").select("*")]);
    const checks = new Set((k.data || []).map(x => `${x.task_id}|${x.period}`));
    return { all: t.data || [], checks };
  }
  /* 등록하기 전에 마감이 지난 달·분기·해는 해당 없음 (지난 마감이 전부 '지남'으로 뜨지 않도록) */
  const applies = (t, p) => periodDue(t, p) >= (t.created_at || TODAY).slice(0, 10);
  function nextPeriod(p) {
    if (p.length === 4) return String(+p + 1);
    const y = +p.slice(0, 4);
    if (p.includes("Q")) { const q = +p.slice(6); return q === 4 ? `${y + 1}-Q1` : `${y}-Q${q + 1}`; }
    const m = +p.slice(5, 7); return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
  }
  /* 지금 기준으로 챙길 회차: 이번 회차가 등록 전에 끝났으면 다음 회차 */
  const currentPeriod = t => { const p = periodFor(t, TODAY); return applies(t, p) ? p : nextPeriod(p); };
  /* 정기 업무를 특정 달·분기의 할 일로 펼침 */
  const instance = (t, period, checks) => ({ ...t, _period: period, due_date: periodDue(t, period), done: checks.has(`${t.id}|${period}`) });
  const byPriority = (a, b) => (a.done - b.done) || ((MARK_ORDER[a.marker] ?? 9) - (MARK_ORDER[b.marker] ?? 9)) || (a.due_date || "9999").localeCompare(b.due_date || "9999");
  /* 매년 업무는 마감 60일 전부터 '지금 할 일'에 올라옴 (1년 내내 떠 있지 않도록) */
  const soon = x => x.repeat !== "yearly" || x.due_date <= ymd(new Date(Date.now() + 60 * 864e5));
  /* 지금 챙겨야 할 것: 안 끝난 일회성 + 이번 달·분기 정기 업무 + 다가오는 매년 업무 */
  function nowList({ all, checks }) {
    const once = all.filter(x => x.repeat === "none" && !x.done);
    const rec = all.filter(x => x.repeat !== "none").map(t => instance(t, currentPeriod(t), checks)).filter(x => !x.done && soon(x));
    return [...once, ...rec].sort(byPriority);
  }

  const who = id => OFFICERS.find(o => o.id === id)?.display_name || "";
  function taskList(list, opts = {}) {
    if (!list.length) return "";
    return `<ul class="tasks">${list.map(x => {
      const over = !x.done && x.due_date && x.due_date < TODAY;
      const ck = x._period ? `data-chk="${x.id}|${x._period}"` : `data-done="${x.id}"`;
      return `<li class="${x.done ? "done" : ""}" ${x.marker ? `style="--fc:${MARKERS[x.marker][1]}" data-mk` : ""}>
      <input type="checkbox" ${ck} ${x.done ? "checked" : ""} aria-label="완료 표시">
      <div class="t"><b>${flag(x.marker)}${h(x.title)}</b><div class="meta"><span class="chip k">${h(x.category || "할 일")}</span>
        ${x._period ? `<span class="chip">↻ ${repeatLabel(x)}${opts.showPeriod ? ` · ${periodName(x._period)}` : ""}</span>` : ""}
        ${x.due_date ? `<span class="${over ? "over" : ""}">마감 ${fmt(x.due_date)}${over ? " (지남)" : ""}</span>` : x.repeat === "none" ? `<span>수시</span>` : ""}
        ${x.assignee ? `<span>담당 ${h(who(x.assignee))}</span>` : ""}${x.memo ? `<span>${h(x.memo)}</span>` : ""}</div></div>
      ${opts.noEdit ? "" : `<button class="btn s w" data-edittask="${x.id}">수정</button>`}
      ${x._period || opts.noEdit ? "" : `<button class="btn s danger" data-deltask="${x.id}" aria-label="삭제">삭제</button>`}</li>`;
    }).join("")}</ul>`;
  }
  function bindTaskList(el, reload) {

      await c.from("tasks").update({ done: i.checked, done_at: i.checked ? new Date().toISOString() : null }).eq("id", i.dataset.done); reload();
    });
    el.querySelectorAll("[data-chk]").forEach(i => i.onchange = async () => {

      else await c.from("task_checks").delete().eq("task_id", id).eq("period", period);

    });
    el.querySelectorAll("[data-deltask]").forEach(b => b.onclick = async () => { if (confirm("삭제할까요?")) { await c.from("tasks").delete().eq("id", b.dataset.deltask); reload(); } });
    el.querySelectorAll("[data-edittask]").forEach(b => b.onclick = () => { taskEditId = b.dataset.edittask; go("tasks"); });
  }

  const STARTER_OLD = { "회계연도 결산서 작성 (전년도)": "2026 회계연도 결산서 작성", "정기총회 개최 (결산 승인, 사업계획 보고)": "정기총회 개최 (결산 승인, 정관 보완 검토)" };
  async function addStarter() {
    const { data } = await c.from("tasks").select("id,title,repeat");
    const have = new Map((data || []).map(x => [x.title, x]));
    const old = t => have.get(STARTER_OLD[t]);
    const rows = STARTER.filter(s => !have.has(s[0]) && !old(s[0])).map(([title, category, due_date, repeat = "none", repeat_day = null, repeat_month = null]) => ({ title, category, due_date: repeat === "none" ? due_date : null, repeat, repeat_day, repeat_month }));
    if (rows.length) await c.from("tasks").insert(rows);
    /* 예전에 불러온 기본 항목 중 정기 업무는 정기로 바꿔 줌 */
    for (const [title, , , repeat = "none", repeat_day = null, repeat_month = null] of STARTER) {
      const ex = have.get(title) || old(title);
      if (ex && repeat !== "none" && ex.repeat === "none") await c.from("tasks").update({ title, repeat, repeat_day, repeat_month, due_date: null }).eq("id", ex.id);
    }
  }

  /* ── 할 일 ── */
  let taskView = "open", taskYear = new Date().getFullYear(), taskEditId = null;
  const TASK_VIEWS = [["open", "지금 할 일"], ["routine", "정기 업무 (월·분기·연)"], ["month", "월별"], ["quarter", "분기별"], ["done", "완료"], ["all", "전체"]];
  async function tasks(el) {
    const data = await loadTasks();
    const { all, checks } = data;
    const once = all.filter(x => x.repeat === "none"), rec = all.filter(x => x.repeat !== "none");
    const monthly = rec.filter(x => x.repeat === "monthly"), quarterly = rec.filter(x => x.repeat === "quarterly"), yearly = rec.filter(x => x.repeat === "yearly");
    const yIn = (ms, y) => yearly.filter(t => ms.includes(t.repeat_month || 12) && applies(t, String(y))).map(t => instance(t, String(y), checks));
    const ed = taskEditId ? all.find(x => String(x.id) === String(taskEditId)) : null;
    const yearSel = `<select data-ty style="width:auto">${[-1, 0, 1].map(i => new Date().getFullYear() + i).map(y => `<option ${y === taskYear ? "selected" : ""}>${y}</option>`).join("")}</select>`;
    const nowN = nowList(data).length;
    const counts = { open: nowN, done: once.filter(x => x.done).length, all: all.length, routine: rec.length };
    let body = "";
    if (taskView === "open") {
      const nl = nowList(data);
      const urgent = nl.filter(x => x.marker === "red" || (x.due_date && x.due_date < TODAY));
      body = `${urgent.length ? `<div class="hot"><b>🔴 먼저 챙길 일 ${urgent.length}건</b> 긴급 표식이거나 마감이 지난 일입니다.</div>` : ""}
        <h4 class="sec">이번 달·분기 정기 업무와 다가오는 연간 업무 <span class="hint">${periodName(monthOf(TODAY))} · ${periodName(quarterOf(TODAY))} · 연간 업무는 마감 60일 전부터</span></h4>
        ${taskList(rec.map(t => instance(t, currentPeriod(t), checks)).filter(soon).sort(byPriority)) || `<p class="empty">지금 챙길 정기 업무가 없습니다. 할 일을 추가할 때 '반복'을 매월·매 분기·매년으로 고르세요.</p>`}
        <h4 class="sec">해야 할 일</h4>${taskList(once.filter(x => !x.done).sort(byPriority)) || `<p class="empty">남은 일이 없습니다.</p>`}`;
    } else if (taskView === "month") {
      body = `<div class="row" style="margin-bottom:8px">${yearSel}<span class="hint">한 해 동안 달마다 해야 할 일을 한 번에 봅니다. 정기 업무는 달마다 따로 체크합니다.</span></div>
        <div class="periods">${Array.from({ length: 12 }, (_, i) => {
          const p = `${taskYear}-${pad(i + 1)}`, qEnd = (i + 1) % 3 === 0 ? `${taskYear}-Q${(i + 1) / 3}` : null;
          const items = [...once.filter(x => x.due_date && monthOf(x.due_date) === p), ...monthly.filter(t => applies(t, p)).map(t => instance(t, p, checks)), ...(qEnd ? quarterly.filter(t => applies(t, qEnd)).map(t => instance(t, qEnd, checks)) : []), ...yIn([i + 1], taskYear)].sort(byPriority);
          const left = items.filter(x => !x.done).length;

        }).join("")}</div>
        ${once.some(x => !x.due_date) ? `<h4 class="sec">마감일 없는 일 (수시)</h4>${taskList(once.filter(x => !x.due_date).sort(byPriority))}` : ""}`;
    } else if (taskView === "quarter") {
      body = `<div class="row" style="margin-bottom:8px">${yearSel}<span class="hint">분기마다 해야 할 일과 그 분기의 매월 업무 진행 상황을 함께 봅니다.</span></div>
        <div class="periods q">${[1, 2, 3, 4].map(q => {
          const p = `${taskYear}-Q${q}`, ms = [q * 3 - 2, q * 3 - 1, q * 3].map(m => `${taskYear}-${pad(m)}`);
          const items = [...once.filter(x => x.due_date && quarterOf(x.due_date) === p), ...quarterly.filter(t => applies(t, p)).map(t => instance(t, p, checks)), ...yIn([q * 3 - 2, q * 3 - 1, q * 3], taskYear)].sort(byPriority);
          return `<section class="per ${p === quarterOf(TODAY) ? "now" : ""}"><h4>${q}분기 <span class="hint">${+ms[0].slice(5)}~${+ms[2].slice(5)}월</span></h4>
            ${taskList(items) || `<p class="empty s">분기 업무 없음</p>`}
            ${monthly.length ? `<table class="mini"><tr><th>매월 업무</th>${ms.map(m => `<th>${+m.slice(5)}월</th>`).join("")}</tr>
              ${monthly.map(t => `<tr><td>${flag(t.marker)}${h(t.title)}</td>${ms.map(m => applies(t, m) ? `<td><input type="checkbox" data-chk="${t.id}|${m}" ${checks.has(`${t.id}|${m}`) ? "checked" : ""} aria-label="${h(t.title)} ${+m.slice(5)}월"></td>` : `<td class="na" title="등록 전">–</td>`).join("")}</tr>`).join("")}</table>` : ""}
          </section>`;
        }).join("")}</div>`;
    } else if (taskView === "routine") {
      const ms = Array.from({ length: 12 }, (_, i) => `${taskYear}-${pad(i + 1)}`), qs = [1, 2, 3, 4].map(q => `${taskYear}-Q${q}`);
      const grid = (list, ps, label) => list.length ? `<div class="tbl-wrap"><table class="matrix"><tr><th>${label}</th>${ps.map(p => `<th class="${p === monthOf(TODAY) || p === quarterOf(TODAY) || p === TODAY.slice(0, 4) ? "nowc" : ""}">${p.length === 4 ? p + "년" : p.includes("Q") ? p.slice(5) : +p.slice(5) + "월"}</th>`).join("")}<th></th></tr>
        ${list.map(t => `<tr><td>${flag(t.marker)}<b>${h(t.title)}</b><br><span class="hint">${repeatLabel(t)}${t.assignee ? " · 담당 " + h(who(t.assignee)) : ""}</span></td>
          ${ps.map(p => { if (!applies(t, p)) return `<td class="na" title="등록 전">–</td>`; const d = checks.has(`${t.id}|${p}`), late = !d && periodDue(t, p) < TODAY; return `<td class="${late ? "late" : ""}"><input type="checkbox" data-chk="${t.id}|${p}" ${d ? "checked" : ""} aria-label="${h(t.title)} ${p}"></td>`; }).join("")}
          <td style="white-space:nowrap"><button class="btn s w" data-edittask="${t.id}">수정</button> <button class="btn s danger" data-deltask="${t.id}">삭제</button></td></tr>`).join("")}</table></div>` : "";
      const ys = [taskYear - 1, taskYear, taskYear + 1].map(String);
      const sorted = list => list.slice().sort((a, b) => ((a.repeat_month || 12) - (b.repeat_month || 12)) || ((a.repeat_day || 31) - (b.repeat_day || 31)));
      const done = (list, p) => list.filter(t => applies(t, p) && checks.has(`${t.id}|${p}`)).length + "/" + list.filter(t => applies(t, p)).length;
      body = `<div class="row" style="margin-bottom:8px">${yearSel}<span class="hint">매번 하는 일을 놓치지 않도록 한곳에 모았습니다. 빨간 칸은 마감이 지났는데 체크하지 않은 칸, '–'는 등록 전입니다.</span></div>
        <div class="kpis rt">
          <div class="kpi"><p>${periodName(monthOf(TODAY))} 매월 업무</p><b>${done(monthly, monthOf(TODAY))}</b></div>
          <div class="kpi"><p>${quarterOf(TODAY).slice(6)}분기 업무</p><b>${done(quarterly, quarterOf(TODAY))}</b></div>
          <div class="kpi"><p>${TODAY.slice(0, 4)}년 연간 업무</p><b>${done(yearly, TODAY.slice(0, 4))}</b></div></div>
        <h4 class="sec">📅 매월 하는 일 <span class="hint">${monthly.length}개</span></h4>${grid(monthly, ms, "업무") || `<p class="empty">매월 업무가 없습니다. 위에서 할 일을 추가할 때 반복을 '매월'로 고르세요.</p>`}
        <h4 class="sec">🗂 분기마다 하는 일 <span class="hint">${quarterly.length}개</span></h4>${grid(quarterly, qs, "업무") || `<p class="empty">분기 업무가 없습니다.</p>`}
        <h4 class="sec">📌 매년 하는 일 <span class="hint">${yearly.length}개 · 마감 달 순서</span></h4>${grid(sorted(yearly), ys, "업무") || `<p class="empty">매년 업무가 없습니다. 반복을 '매년'으로 고르고 달을 정하세요.</p>`}`;
    } else {
      const list = taskView === "done" ? once.filter(x => x.done) : [...once, ...rec];
      body = taskList(list.sort(byPriority)) || `<p class="empty">항목이 없습니다.</p>`;
    }
    el.innerHTML = `<h2>할 일·체크리스트</h2><p class="lead">마감일이 있는 일과 정기 업무는 달력에도 표시됩니다. 급한 일은 <b>표식</b>을 달면 맨 위에 빨갛게 보입니다.</p>
      <div class="panel" data-taskpanel><h3>${ed ? `할 일 수정 <span class="chip y">${h(ed.title)}</span>` : "할 일 추가"}</h3>
        <form class="form" data-f>
          <div class="f2"><label>할 일<input name="title" required maxlength="200"></label>
            <label>분류<select name="category">${TASK_CATS.map(x => `<option>${x}</option>`).join("")}</select></label>
            <label>반복<select name="repeat"><option value="none">한 번</option><option value="monthly">매월</option><option value="quarterly">매 분기</option><option value="yearly">매년</option></select></label>
            <label data-once>마감일<input type="date" name="due_date"></label>
            <label data-repm hidden>몇 월에<select name="repeat_month">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}월</option>`).join("")}</select></label>
            <label data-rep hidden><span data-replbl>마감일 (며칠)</span><input type="number" name="repeat_day" min="1" max="31" placeholder="비우면 말일"></label></div>
          <div class="f2"><label>담당<select name="assignee"><option value="">없음</option>${OFFICERS.map(o => `<option value="${o.id}">${h(o.display_name)}</option>`).join("")}</select></label>
            <label>표식 (책갈피)${markerSel("")}</label></div>
          <label>메모<input name="memo" maxlength="500"></label>
          <div class="row"><button class="btn" data-tsave>${ed ? "수정 저장" : "추가"}</button>${ed ? `<button type="button" class="btn w" data-tcancel>수정 취소</button>` : `<button type="button" class="btn w" data-starter>운영 기본 체크리스트 불러오기</button>`}<span data-m></span></div>
        </form></div>
      <div class="panel"><div class="row tabs" style="margin-bottom:10px">
        ${TASK_VIEWS.map(([k, l]) => `<button class="btn s ${k === taskView ? "" : "w"}" data-flt="${k}">${l}${counts[k] != null ? ` ${counts[k]}` : ""}</button>`).join("")}</div>
        ${body}</div>`;
    const f = el.querySelector("[data-f]");
    const syncRepeat = () => {
      const v = f.repeat.value, r = v !== "none";
      el.querySelector("[data-once]").hidden = r; el.querySelector("[data-rep]").hidden = !r; el.querySelector("[data-repm]").hidden = v !== "yearly";
      el.querySelector("[data-replbl]").textContent = v === "monthly" ? "매월 며칠까지" : v === "quarterly" ? "분기 마지막 달 며칠까지" : "그 달 며칠까지";
    };
    f.repeat.onchange = syncRepeat;
    if (ed) {
      ["title", "category", "repeat", "due_date", "repeat_day", "assignee", "marker", "memo"].forEach(k => { f[k].value = ed[k] ?? ""; });
      f.repeat_month.value = ed.repeat_month || 12;
      el.querySelector("[data-tcancel]").onclick = () => { taskEditId = null; tasks(el); };
      el.querySelector("[data-taskpanel]").scrollIntoView({ block: "start" });
    }
    syncRepeat();
    f.onsubmit = async e => {
      e.preventDefault();
      const repeat = f.repeat.value;
      const row = { title: f.title.value.trim(), category: f.category.value, repeat, due_date: repeat === "none" ? f.due_date.value || null : null,
        repeat_day: repeat === "none" || f.repeat_day.value === "" ? null : Math.min(31, Math.max(1, +f.repeat_day.value)),
        repeat_month: repeat === "yearly" ? +f.repeat_month.value : null,
        assignee: f.assignee.value || null, marker: f.marker.value || null, memo: f.memo.value.trim() || null };
      const { error } = ed ? await c.from("tasks").update(row).eq("id", ed.id) : await c.from("tasks").insert(row);
      if (error) return msg(el.querySelector("[data-m]"), SB.errText(error));
      taskEditId = null; tasks(el);
    };
    el.querySelector("[data-starter]")?.addEventListener("click", async () => { await addStarter(); tasks(el); });
    el.querySelectorAll("[data-flt]").forEach(b => b.onclick = () => { taskView = b.dataset.flt; tasks(el); });
    el.querySelector("[data-ty]")?.addEventListener("change", e => { taskYear = +e.target.value; tasks(el); });
    bindTaskList(el, () => tasks(el));
  }

  /* ── 팝업 ── */
  function modal(html, onReady) {
    const m = document.createElement("div");
    m.className = "modal"; m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><button type="button" class="modal-x" aria-label="닫기">×</button>${html}</div>`;
    const close = () => { m.remove(); document.removeEventListener("keydown", esc); };
    const esc = e => { if (e.key === "Escape") close(); };
    m.onclick = e => { if (e.target === m || e.target.closest(".modal-x")) close(); };
    document.addEventListener("keydown", esc);
    document.body.appendChild(m);
    m.querySelector("input, select, textarea, button:not(.modal-x)")?.focus();
    onReady && onReady(m.querySelector(".modal-box"), close);
  }

  /* ── 달력 ── */
  let calYM = new Date(); calYM.setDate(1); let calSel = TODAY;
  const EV_CATS = ["일정", "회의", "행사", "마감", "기타"];
  function eventForm(e = {}) {
    return `<form class="form" data-evf>
      <label>일정<input name="title" required maxlength="200" value="${h(e.title || "")}" placeholder="예: 운영회의, 갯골축제 공연"></label>
      <div class="f2"><label>시작일<input type="date" name="start_date" required value="${e.start_date || calSel}"></label>
        <label>종료일 (여러 날일 때)<input type="date" name="end_date" value="${e.end_date || ""}"></label>
        <label>분류<select name="category">${EV_CATS.map(x => `<option ${x === (e.category || "일정") ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        <label>표식 (책갈피)${markerSel(e.marker || "")}</label></div>
      <label>메모<textarea name="memo" maxlength="2000" placeholder="장소, 준비물, 연락처 등">${h(e.memo || "")}</textarea></label>
      <div class="row"><button class="btn">${e.id ? "수정 저장" : `일정 추가`}</button>${e.id ? `<button type="button" class="btn danger" data-evdel>삭제</button>` : ""}<span data-m></span></div></form>`;
  }
  async function saveEvent(f, id) {
    const row = { title: f.title.value.trim(), category: f.category.value, start_date: f.start_date.value, end_date: f.end_date.value && f.end_date.value !== f.start_date.value ? f.end_date.value : null, marker: f.marker.value || null, memo: f.memo.value.trim() || null };
    if (row.end_date && row.end_date < row.start_date) return "종료일이 시작일보다 빠릅니다.";
    const { error } = id ? await c.from("events").update(row).eq("id", id) : await c.from("events").insert(row);
    return error ? SB.errText(error) : null;
  }
  async function cal(el) {
    const y = calYM.getFullYear(), m = calYM.getMonth();
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
    const end = new Date(start); end.setDate(start.getDate() + 41);
    const [ev, td] = await Promise.all([
      c.from("events").select("*").lte("start_date", ymd(end)).or(`end_date.gte.${ymd(start)},start_date.gte.${ymd(start)}`),
      loadTasks(),
    ]);
    const evs = ev.data || [];
    /* 달력 범위(6주) 안의 할 일: 일회성 마감 + 정기 업무의 달·분기별 마감 */
    const periods = new Set();
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) { const k = ymd(d); periods.add(monthOf(k)); periods.add(quarterOf(k)); periods.add(k.slice(0, 4)); }
    const tks = [...td.all.filter(t => t.repeat === "none" && t.due_date),
      ...td.all.filter(t => t.repeat !== "none").flatMap(t => [...periods].filter(p => kindOf(p) === t.repeat && applies(t, p)).map(p => instance(t, p, td.checks)))];
    const on = d => evs.filter(e => e.start_date <= d && (e.end_date || e.start_date) >= d).sort((a, b) => (MARK_ORDER[a.marker] ?? 9) - (MARK_ORDER[b.marker] ?? 9));
    const due = d => tks.filter(t => t.due_date === d).sort(byPriority);
    const chip = (kind, x) => kind === "ev"
      ? `<span class="ev ${x.marker ? "mk" : ""}" ${x.marker ? `style="--fc:${MARKERS[x.marker][1]}"` : ""} data-ev="${x.id}" title="${h(x.title)}">${h(x.title)}</span>`
      : `<span class="ev task ${x.done ? "dn2" : ""} ${x.marker ? "mk" : ""}" ${x.marker ? `style="--fc:${MARKERS[x.marker][1]}"` : ""} data-tk="${x.id}${x._period ? "|" + x._period : ""}" title="${h(x.title)}">${x._period ? "↻" : "☐"} ${h(x.title)}</span>`;
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i); const k = ymd(d);
      const items = [...on(k).map(e => chip("ev", e)), ...due(k).map(t => chip("tk", t))];
      cells += `<div role="button" tabindex="0" class="d ${d.getMonth() !== m ? "out" : ""} ${k === TODAY ? "today" : ""} ${k === calSel ? "sel" : ""}" data-day="${k}">
        <span class="dn">${d.getDate()}</span>${items.slice(0, 3).join("")}${items.length > 3 ? `<span class="more">+${items.length - 3}개 더</span>` : ""}</div>`;
    }
    const mStart = ymd(first), mEnd = ymd(new Date(y, m + 1, 0));
    const marked = [...evs.filter(e => e.marker && e.start_date <= mEnd && (e.end_date || e.start_date) >= mStart).map(e => ({ d: e.start_date, kind: "ev", x: e })),
      ...tks.filter(t => t.marker && t.due_date >= mStart && t.due_date <= mEnd && !t.done).map(t => ({ d: t.due_date, kind: "tk", x: t }))]
      .sort((a, b) => (MARK_ORDER[a.x.marker] - MARK_ORDER[b.x.marker]) || a.d.localeCompare(b.d));
    el.innerHTML = `<h2>달력</h2><p class="lead">날짜를 누르면 그날 일정을 보고 추가합니다. 일정을 누르면 자세한 내용이 팝업으로 뜨고 바로 고칠 수 있습니다. 노란색은 할 일, ↻는 정기 업무입니다.</p>
      <div class="grid" style="grid-template-columns:minmax(0,1fr)">
      <div class="panel"><div class="cal-h"><button class="btn s w" data-mv="-1" aria-label="이전 달">‹</button><b>${y}년 ${m + 1}월</b><button class="btn s w" data-mv="1" aria-label="다음 달">›</button><button class="btn s w" data-mv="0">오늘</button>
          <span class="legend">${Object.values(MARKERS).map(([l, col]) => `<span class="flag" style="--fc:${col}">${l}</span>`).join("")}</span></div>
        <div class="cal">${["일", "월", "화", "수", "목", "금", "토"].map(w => `<div class="dw">${w}</div>`).join("")}${cells}</div></div>
      ${marked.length ? `<div class="panel"><h3>이번 달 표식 모아보기 <span class="hint">${marked.length}건</span></h3><ul class="tasks">${marked.map(({ d, kind, x }) => `<li style="--fc:${MARKERS[x.marker][1]}" data-mk>
        <span class="chip ${kind === "ev" ? "" : "y"}">${fmt(d)}</span><div class="t"><b>${flag(x.marker)}${h(x.title)}</b><div class="meta">${kind === "ev" ? h(x.category || "일정") : x._period ? "정기 업무" : "할 일"}</div></div>
        <button class="btn s w" ${kind === "ev" ? `data-ev="${x.id}"` : `data-tk="${x.id}${x._period ? "|" + x._period : ""}"`}>보기</button></li>`).join("")}</ul></div>` : ""}
      <div class="panel"><h3>${fmt(calSel)}</h3>
        <ul class="tasks">${on(calSel).map(e => `<li ${e.marker ? `style="--fc:${MARKERS[e.marker][1]}" data-mk` : ""}><span class="chip">${h(e.category || "일정")}</span><div class="t"><b>${flag(e.marker)}${h(e.title)}</b><div class="meta">${fmt(e.start_date)}${e.end_date && e.end_date !== e.start_date ? " ~ " + fmt(e.end_date) : ""}${e.memo ? " · " + h(e.memo) : ""}</div></div><button class="btn s w" data-ev="${e.id}">보기·수정</button></li>`).join("")}
          ${due(calSel).map(t => `<li ${t.marker ? `style="--fc:${MARKERS[t.marker][1]}" data-mk` : ""}><span class="chip y">${t._period ? "정기" : "할 일"}</span><div class="t"><b>${flag(t.marker)}${h(t.title)}</b>${t.done ? ' <span class="chip g">완료</span>' : ""}</div><button class="btn s w" data-tk="${t.id}${t._period ? "|" + t._period : ""}">보기</button></li>`).join("")}</ul>
        ${!on(calSel).length && !due(calSel).length ? `<p class="empty">이날 일정이 없습니다.</p>` : ""}
        <div style="margin-top:12px">${eventForm()}</div></div></div>`;
    el.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const v = +b.dataset.mv; if (!v) { calYM = new Date(); calYM.setDate(1); calSel = TODAY; } else calYM.setMonth(calYM.getMonth() + v); cal(el); });
    const openEv = id => {
      const e = evs.find(x => String(x.id) === String(id)); if (!e) return;
      modal(`<p class="hint">${h(e.category || "일정")} ${flag(e.marker)}</p><h3 class="m-title">${h(e.title)}</h3>
        <p class="m-meta">${fmt(e.start_date)}${e.end_date ? " ~ " + fmt(e.end_date) : ""}</p>${e.memo ? `<p class="m-memo">${h(e.memo)}</p>` : ""}
        <details class="m-edit"><summary>수정하기</summary>${eventForm(e)}</details>`, (box, close) => {
        const f = box.querySelector("[data-evf]");
        f.onsubmit = async ev2 => { ev2.preventDefault(); const err = await saveEvent(f, e.id); if (err) return msg(f.querySelector("[data-m]"), err); close(); cal(el); };
        box.querySelector("[data-evdel]").onclick = async () => { if (!confirm("일정을 삭제할까요?")) return; await c.from("events").delete().eq("id", e.id); close(); cal(el); };
      });
    };
    const openTk = key => {
      const [id, period] = key.split("|"); const t = tks.find(x => String(x.id) === id && (x._period || "") === (period || "")); if (!t) return;
      modal(`<p class="hint">${h(t.category || "할 일")} ${flag(t.marker)} ${t._period ? `· ↻ ${repeatLabel(t)} · ${periodName(t._period)}` : ""}</p><h3 class="m-title">${h(t.title)}</h3>
        <p class="m-meta">마감 ${fmt(t.due_date)}${t.assignee ? ` · 담당 ${h(who(t.assignee))}` : ""}</p>${t.memo ? `<p class="m-memo">${h(t.memo)}</p>` : ""}
        <div class="row"><label class="ck"><input type="checkbox" data-mdone ${t.done ? "checked" : ""}> 완료</label><button type="button" class="btn w" data-medit>할 일에서 수정</button></div>`, (box, close) => {
        box.querySelector("[data-mdone]").onchange = async ev2 => {
          const on2 = ev2.target.checked;
          if (t._period) on2 ? await c.from("task_checks").insert({ task_id: t.id, period: t._period }) : await c.from("task_checks").delete().eq("task_id", t.id).eq("period", t._period);
          else await c.from("tasks").update({ done: on2, done_at: on2 ? new Date().toISOString() : null }).eq("id", t.id);
          close(); cal(el);
        };
        box.querySelector("[data-medit]").onclick = () => { close(); taskEditId = t.id; go("tasks"); };
      });
    };
    el.onclick = e => {
      const ch = e.target.closest("[data-ev], [data-tk]");
      if (ch) { e.stopPropagation(); return ch.dataset.ev ? openEv(ch.dataset.ev) : openTk(ch.dataset.tk); }
      const d = e.target.closest("[data-day]");
      if (d) { calSel = d.dataset.day; cal(el); }
    };
    el.onkeydown = e => { const d = e.target.closest?.("[data-day]"); if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); calSel = d.dataset.day; cal(el); } };
    const f = el.querySelector(".panel:last-child [data-evf]");
    f.onsubmit = async e => { e.preventDefault(); const err = await saveEvent(f); if (err) return msg(f.querySelector("[data-m]"), err); cal(el); };
  }

  /* ── 활동 기록 (홈페이지 활동 소식·마을 지도에 반영) ── */
  async function acts(el, editId = null) {
    const { data } = await c.from("activities").select("*").order("activity_date", { ascending: false, nullsFirst: false });
    const list = data || [];
    el.innerHTML = `<h2>활동 기록</h2><p class="lead"><b>공개</b>로 저장한 활동은 홈페이지 활동 소식, 숫자 집계, 마을 지도에 바로 반영됩니다. 활동이 끝나면 1주일 안에 기록하세요.</p>
      <div class="panel" data-actpanel><h3 data-acth>활동 추가</h3>
        <form class="form" data-f>
          <div class="f2"><label>활동명<input name="title" required maxlength="120"></label>
            <label>날짜<input type="date" name="activity_date"></label>
            <label>유형<select name="activity_type">${ACT_TYPES.map(x => `<option>${x}</option>`).join("")}</select></label>
            <label>동 (마을 지도)<select name="dong"><option value="">선택</option>${DONGS.map(d => `<option>${d}</option>`).join("")}</select></label></div>
          <div class="f2"><label>장소<input name="place" maxlength="120"></label>

          <div class="row">
            <label class="ck"><input type="checkbox" name="paid"> 유상(계약·위탁)</label>
            <label class="ck"><input type="checkbox" name="portrait_consent"> 사진 속 인물 초상권 동의 받음</label>
            <label class="ck"><input type="checkbox" name="has_minor"> 미성년자 포함</label>
            <label class="ck"><input type="checkbox" name="guardian_consent"> 법정대리인 동의 받음</label>
            <label class="ck"><input type="checkbox" name="is_public" checked> 홈페이지에 공개</label></div>
          <div class="row"><button class="btn" data-actsave>저장</button><button type="button" class="btn w" data-actcancel hidden>수정 취소</button><span data-m></span></div>
          <p class="hint">사진이 있으면 초상권 동의가, 미성년자가 있으면 법정대리인 동의가 있어야 공개됩니다. 데이터베이스가 직접 막습니다.</p>
        </form></div>
      <div class="panel"><h3>기록된 활동 ${list.length}건</h3><div class="tbl-wrap"><table>
        <tr><th>날짜</th><th>활동</th><th>동</th><th class="num">수혜</th><th>공개</th><th></th></tr>
        ${list.map(a => `<tr><td>${fmt(a.activity_date)}</td><td><b>${h(a.title)}</b><br><span class="hint">${h(a.activity_type || "")}${a.place ? " · " + h(a.place) : ""}${a.host_org ? " · " + h(a.host_org) : ""}</span></td>
          <td>${a.dong ? h(a.dong) : `<span class="chip r">동 없음</span>`}</td><td class="num">${a.beneficiaries ?? ""}</td>
          <td><button class="btn s ${a.is_public ? "" : "w"}" data-pub="${a.id}" data-v="${a.is_public}">${a.is_public ? "공개" : "비공개"}</button></td>
          <td style="white-space:nowrap"><button class="btn s w" data-edit="${a.id}">수정</button> <button class="btn s danger" data-del="${a.id}">삭제</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty">아직 기록이 없습니다.</td></tr>`}
      </table></div></div>`;
    const f = el.querySelector("[data-f]");
    const ed = editId ? list.find(a => String(a.id) === String(editId)) : null;
    if (ed) {
      ["title", "activity_date", "activity_type", "dong", "place", "host_org", "beneficiaries", "members_joined", "description"].forEach(k => { f[k].value = ed[k] ?? ""; });
      ["paid", "portrait_consent", "has_minor", "guardian_consent", "is_public"].forEach(k => { f[k].checked = !!ed[k]; });
      el.querySelector("[data-acth]").innerHTML = `활동 수정 <span class="chip y">${h(ed.title)}</span>`;
      el.querySelector("[data-actsave]").textContent = "수정 저장";
      const cancel = el.querySelector("[data-actcancel]"); cancel.hidden = false; cancel.onclick = () => acts(el);
      el.querySelector("[data-actpanel]").scrollIntoView({ block: "start" });
    }
    el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => acts(el, b.dataset.edit));
    f.onsubmit = async e => {
      e.preventDefault();
      const d = f.activity_date.value;
      const row = {
        title: f.title.value.trim(), activity_date: d || null, date_label: d ? d.replaceAll("-", ".") : null, activity_type: f.activity_type.value,
        dong: f.dong.value || null, place: f.place.value.trim() || null, host_org: f.host_org.value.trim() || null,
        beneficiaries: f.beneficiaries.value === "" ? null : +f.beneficiaries.value, members_joined: f.members_joined.value === "" ? null : +f.members_joined.value,
        description: f.description.value.trim() || null, image_url: f.image_url.value.trim() || null, paid: f.paid.checked,
        portrait_consent: f.portrait_consent.checked, has_minor: f.has_minor.checked, guardian_consent: f.guardian_consent.checked, is_public: f.is_public.checked,
      };
      if (ed) {
        delete row.image_url;                                   /* 사진은 홈페이지 활동 상세에서 관리 */
        if (!d) row.date_label = ed.date_label;                 /* 날짜 없이 적은 표기(예: 2026.07~) 유지 */
        else if (ed.activity_date === d && ed.date_label) row.date_label = ed.date_label;
      }
      const { error } = ed ? await c.from("activities").update(row).eq("id", ed.id) : await c.from("activities").insert(row);
      if (error) return msg(el.querySelector("[data-m]"), /publish_consent/.test(error.message) ? "사진 초상권 동의 또는 미성년자 법정대리인 동의가 없어 공개할 수 없습니다. 동의를 확인하거나 비공개로 저장하세요." : SB.errText(error));
      acts(el);
    };
    el.querySelectorAll("[data-pub]").forEach(b => b.onclick = async () => {
      const { error } = await c.from("activities").update({ is_public: b.dataset.v !== "true" }).eq("id", b.dataset.pub);
      if (error) return alert(/publish_consent/.test(error.message) ? "동의 확인이 없어 공개할 수 없습니다." : SB.errText(error)); acts(el);
    });
    el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("삭제할까요? 올린 사진도 함께 지워집니다.")) return;
      const { data: a } = await c.from("activities").select("image_url,photos").eq("id", b.dataset.del).maybeSingle();
      const { error } = await c.from("activities").delete().eq("id", b.dataset.del);
      if (error) return alert(error.message);
      const k = "/object/public/activity-photos/";
      const paths = [...new Set([...(a?.photos || []), a?.image_url])].filter(u => u && u.includes(k)).map(u => decodeURIComponent(u.split(k)[1]));
      if (paths.length) await c.storage.from("activity-photos").remove(paths);
      acts(el);
    });
  }

  /* ── 홈페이지 관리 ──
     저장하면 홈페이지에 바로 반영됩니다(방문자는 새로고침 후). 기본값은 assets/site-data.js */
  const SITE_FORMS = [
    { key: "recruits", title: "참여 모집", item: "모집", view: "index.html#/",
      desc: "홈 화면 '참여 모집'에 나옵니다. 마감일을 넣으면 D-day, 정원을 넣으면 진행 막대가 표시됩니다.",
      fields: [["org", "구분", "text", "예: 회원 모집, 자원봉사"], ["title", "제목"], ["place", "장소"], ["time", "활동 시간"],
        ["period", "접수 기간", "text", "예: 상시, 10.1~10.15"], ["deadline", "마감일", "date"], ["capacity", "정원", "number"], ["applied", "신청 인원", "number"],
        ["link", "누르면 갈 주소", "text", "예: #/join/member 또는 https://신청서 주소"]] },
    { key: "programs", title: "주요활동 진행 상태", status: true, view: "index.html#/programs/list",
      desc: "시작한 사업은 '수행 중'으로 바꾸세요. 홈 화면 숫자(운영 중인 사업)도 함께 바뀝니다." },
    { key: "history", title: "연혁", item: "연혁", view: "index.html#/about/history",
      fields: [["date", "날짜", "text", "예: 2026.07.02 또는 2026.07"], ["text", "내용"]] },
    { key: "team", title: "조직 (운영진)", item: "사람", view: "index.html#/about/team",
      desc: "이름을 넣은 사람만 홈페이지에 나옵니다. 이름이 하나라도 있으면 '조직' 메뉴가 나타납니다. 사진은 선택입니다(본인 동의 필수).",
      fields: [["role", "직책"], ["name", "이름"], ["bio", "소개", "textarea"], ["photo", "사진", "photo"]] },
    { key: "places", title: "마을 거점", item: "거점", view: "index.html#/map/all",
      desc: "동을 넣으면 마을 지도에 핀이 찍힙니다.",
      fields: [["name", "이름"], ["type", "종류", "text", "예: 거점, 협력 공간"], ["dong", "동", "dong"], ["address", "주소"]] },
    { key: "site", title: "기본 정보", obj: true, view: "index.html#/about/location",
      desc: "푸터, 오시는 길, 문의 버튼에 쓰입니다. 비워 둔 항목은 화면에서 숨겨집니다.",
      fields: [["mission", "미션", "textarea"], ["vision", "비전", "textarea"], ["rep", "대표자"], ["address", "주소"],
        ["regNo", "고유번호", "text", "000-00-00000"], ["email", "문의 이메일", "email", "넣으면 '이메일로 보내기' 버튼이 생깁니다"],
        ["instagramUrl", "인스타그램 주소", "text", "https://instagram.com/계정"], ["greeting", "대표 인사말", "textarea", "비우면 '인사말' 메뉴가 숨겨집니다"]] },
  ];
  const clone = v => JSON.parse(JSON.stringify(v));
  function fieldHtml([k, label, type = "text", ph = ""], v) {
    const val = h(v ?? "");
    const hint = ph && type !== "text" ? ` <span class="hint">${h(ph)}</span>` : "";
    if (type === "textarea") return `<label style="grid-column:1/-1">${label}${hint}<textarea data-k="${k}" maxlength="2000">${val}</textarea></label>`;
    if (type === "dong") return `<label>${label}<select data-k="${k}"><option value="">선택 안 함</option>${DONGS.map(d => `<option ${v === d ? "selected" : ""}>${d}</option>`).join("")}</select></label>`;
    if (type === "photo") return `<div style="grid-column:1/-1"><span class="hint" style="font-weight:700;color:var(--ink2)">${label}</span><div class="ph-prev">
        ${v ? `<img src="${val}" alt="">` : ""}<label class="btn w s">${v ? "바꾸기" : "사진 올리기"}<input type="file" accept="image/*" hidden data-photo="${k}"></label>
        ${v ? `<button type="button" class="btn w s" data-unphoto="${k}">빼기</button>` : ""}</div></div>`;
    return `<label>${label}<input type="${type}" data-k="${k}" value="${val}" ${type === "number" ? 'min="0"' : ""} maxlength="300" placeholder="${h(type === "text" ? ph : "")}"></label>`;
  }
  async function site(el) {
    const { data } = await c.from("site_settings").select("*");
    const rows = Object.fromEntries((data || []).map(r => [r.key, r]));
    el.innerHTML = `<h2>홈페이지 관리</h2><p class="lead">여기서 고친 내용은 저장 즉시 홈페이지에 반영됩니다. 활동 소식과 공지사항은 홈페이지에서 직접 쓰고 고칩니다.
      <br><a href="index.html#/news/activities" style="text-decoration:underline">활동 소식 쓰기</a> · <a href="index.html#/board/write?b=notice" style="text-decoration:underline">공지 쓰기</a></p>
      ${SITE_FORMS.map(F => `<div class="panel" data-sk="${F.key}"></div>`).join("")}`;
    SITE_FORMS.forEach(F => sitePanel(el.querySelector(`[data-sk="${F.key}"]`), F, rows[F.key]));
  }
  function sitePanel(box, F, row) {
    const D = SITE_DEFAULTS[F.key];
    let st = row ? clone(row.value) : clone(D);
    if (F.obj) st = { ...clone(D), ...st };
    if (F.status) st = { ...clone(D), ...st };
    const who = row ? `마지막 수정 ${fmt(row.updated_at)}${OFFICERS.find(o => o.id === row.updated_by) ? " · " + h(OFFICERS.find(o => o.id === row.updated_by).display_name) : ""}` : "기본값 사용 중";
    const paint = () => {
      let body;
      if (F.status) body = PROGRAMS.map(p => `<div class="st-row"><span>${h(p.title)}</span><select data-prog="${p.key}">${PROGRAM_STATUS.map(x => `<option ${st[p.key] === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>`).join("");
      else if (F.obj) body = `<div class="form"><div class="f2">${F.fields.map(f => fieldHtml(f, st[f[0]])).join("")}</div></div>`;
      else body = (st.length ? st.map((it, i) => `<div class="li-item" data-i="${i}"><div class="li-h"><b>${F.item} ${i + 1}</b>
          <button type="button" class="btn w s" data-mv="-1" ${i ? "" : "disabled"} aria-label="위로">↑</button><button type="button" class="btn w s" data-mv="1" ${i < st.length - 1 ? "" : "disabled"} aria-label="아래로">↓</button>
          <button type="button" class="btn s danger" data-rm>삭제</button></div>
          <div class="form"><div class="f2">${F.fields.map(f => fieldHtml(f, it[f[0]])).join("")}</div></div></div>`).join("")
          : `<p class="empty">항목이 없습니다. 비워 두면 홈페이지에서 이 부분이 숨겨집니다.</p>`)
          + `<div class="row" style="margin-top:10px"><button type="button" class="btn w" data-add>＋ ${F.item} 추가</button></div>`;
      box.innerHTML = `<h3>${F.title}<span class="upd">${who}</span></h3>${F.desc ? `<p class="hint" style="margin:-4px 0 14px">${h(F.desc)}</p>` : ""}
        ${body}
        <div class="row" style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><button type="button" class="btn" data-save>저장</button>
          <a class="btn w" href="${F.view}" target="_blank" rel="noopener">홈페이지에서 보기</a>
          ${row ? `<button type="button" class="btn w" data-reset>기본값으로 되돌리기</button>` : ""}<span data-m></span></div>`;
    };
    paint();
    const setVal = (t, v) => {
      if (F.status) { st[t.dataset.prog] = v; return; }
      const it = t.closest("[data-i]"); const tgt = F.obj ? st : st[+it.dataset.i];
      tgt[t.dataset.k] = v;
    };
    box.oninput = e => { const t = e.target; if (t.dataset.k || t.dataset.prog) setVal(t, t.value); };
    box.onchange = async e => {
      const t = e.target;
      if (t.dataset.k || t.dataset.prog) return setVal(t, t.value);
      if (t.dataset.photo) {
        const file = t.files[0]; if (!file) return;
        const m = box.querySelector("[data-m]"); msg(m, "사진 올리는 중…", true);
        try { const u = await SB.uploadPhoto(file, "site", 800); (F.obj ? st : st[+t.closest("[data-i]").dataset.i])[t.dataset.photo] = u; paint(); msg(box.querySelector("[data-m]"), "사진을 올렸습니다. 저장을 눌러야 홈페이지에 반영됩니다.", true); }
        catch (err) { msg(m, err.message); }
      }
    };
    box.onclick = async e => {
      const b = e.target.closest("button"); if (!b) return;
      const it = b.closest("[data-i]"), i = it ? +it.dataset.i : -1;
      if (b.dataset.add !== undefined) { st.push(Object.fromEntries(SITE_FIELDS[F.key].map(k => [k, ""]))); paint(); [...box.querySelectorAll(".li-item")].pop()?.querySelector("input, textarea")?.focus(); return; }
      if (b.dataset.rm !== undefined) { if (confirm(`${F.item} ${i + 1}을(를) 목록에서 뺄까요? 저장해야 반영됩니다.`)) { st.splice(i, 1); paint(); } return; }
      if (b.dataset.mv) { const j = i + +b.dataset.mv; [st[i], st[j]] = [st[j], st[i]]; paint(); return; }
      if (b.dataset.unphoto) { (F.obj ? st : st[i])[b.dataset.unphoto] = ""; paint(); return; }
      const m = box.querySelector("[data-m]");
      if (b.dataset.reset !== undefined) {
        if (!confirm(`${F.title}을(를) 처음 기본값으로 되돌릴까요? 여기서 고친 내용은 사라집니다.`)) return;
        const { error } = await c.from("site_settings").delete().eq("key", F.key);
        if (error) return msg(m, SB.errText(error));
        return sitePanel(box, F, null);
      }
      if (b.dataset.save !== undefined) {
        let value;
        if (F.status) value = st;
        else if (F.obj) {
          value = Object.fromEntries(SITE_FIELDS.site.map(k => [k, String(st[k] ?? "").trim()]));
          if (value.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value.email)) return msg(m, "이메일 형식을 확인하세요.");
          if (value.instagramUrl && !/^https:\/\//.test(value.instagramUrl)) return msg(m, "인스타그램 주소는 https:// 로 시작해야 합니다.");
        } else {
          value = st.map(x => cleanItem(F.key, Object.fromEntries(Object.entries(x).map(([k, v]) => [k, String(v ?? "").trim()]))))
            .filter(x => Object.values(x).some(v => v));
          const bad = st.findIndex(x => x.link && !safeUrl(x.link.trim()));
          if (bad >= 0) return msg(m, `${F.item} ${bad + 1}: 주소는 #/ 또는 https:// 로 시작해야 합니다.`);
          const badDate = value.findIndex(x => "date" in x && !/^\d{4}\.\d{2}(\.\d{2})?$/.test(x.date));
          if (F.key === "history" && badDate >= 0) return msg(m, `연혁 ${badDate + 1}: 날짜는 2026.07.02 또는 2026.07 형식으로 넣으세요.`);
          const noTitle = value.findIndex(x => F.key === "recruits" ? !x.title : F.key === "team" ? false : F.key === "places" ? !x.name : !x.text);
          if (noTitle >= 0) return msg(m, `${F.item} ${noTitle + 1}: ${F.key === "history" ? "내용" : F.key === "recruits" ? "제목" : "이름"}을 넣어 주세요.`);
        }
        b.disabled = true;
        const { data: saved, error } = await c.from("site_settings").upsert({ key: F.key, value }).select("*").single();
        b.disabled = false;
        if (error) return msg(m, SB.errText(error));
        sitePanel(box, F, saved);
        msg(box.querySelector("[data-m]"), "저장했습니다. 홈페이지에 반영됐습니다.", true);
      }
    };
  }

          <dl>${A("생년월일", a.birth_date)}${A("연령 요건", a.age_ok == null ? "" : a.age_ok ? "해당" : "해당 안 함")}${A("연락처", a.phone)}${A("지역 요건", a.region_status)}
            ${A("주 분야", a.main_field)}${A("그 밖의 분야", a.sub_fields)}${A("활동 코드", a.role_codes)}${A("경력", a.career)}${A("자격", a.certificates)}${A("예술활동증명", a.artist_cert)}
            ${A("장비", a.equipment)}${A("가능 시간", a.available_times)}${A("차량", a.has_vehicle == null ? "" : a.has_vehicle ? "보유" : "미보유")}${A("소득 구분", a.income_type)}
            ${A("희망 프로젝트", a.wish_project)}${A("포트폴리오", a.portfolio_url)}
            <dt>동의</dt><dd>필수 ✓ · 사진 홍보 ${a.consent_photo ? "✓" : "✗"} · 주관기관 제공 ${a.consent_provide ? "✓" : "✗"}</dd></dl>
          <div class="row"><button class="btn" data-ok="${a.id}">승인</button><button class="btn danger" data-no="${a.id}">반려</button><button class="btn w" data-doc="${a.id}">신청서 완성본 보기</button></div></details>`).join("") || `<p class="empty">대기 중인 신청이 없습니다.</p>`}</div>
      <div class="panel"><h3>회원 ${ppl.length}명</h3><div class="tbl-wrap"><table>
        <tr><th>활동명</th><th>이름</th><th>유형</th><th>소속</th><th>동</th><th>가입일</th><th>신청서</th><th>권한</th><th>회계</th></tr>
        ${ppl.map(p => `<tr><td><b>${h(p.display_name)}</b></td><td>${h(p.real_name || "")}</td><td>${h(p.member_type)}</td><td>${h(p.org_name || "")}</td><td>${h(p.dong || "")}</td><td>${fmt(p.created_at)}</td>
          <td>${(() => { const a = apps.find(x => x.user_id === p.id && x.status !== "rejected") || apps.find(x => x.user_id === p.id); return a ? `<button class="btn s w" data-doc="${a.id}">보기</button>` : ""; })()}</td>
          <td>${isAdmin && p.id !== ME.user.id ? `<select data-role="${p.id}">${Object.entries(SB.ROLE_LABEL).map(([k, v]) => `<option value="${k}" ${k === p.role ? "selected" : ""}>${v}</option>`).join("")}</select>` : `<span class="chip ${p.role === "user" ? "k" : ""}">${SB.ROLE_LABEL[p.role]}</span>`}</td>
          <td>${isAdmin && p.id !== ME.user.id ? `<input type="checkbox" data-acc="${p.id}" ${p.can_accounting ? "checked" : ""} aria-label="회계 담당">` : p.can_accounting ? "✓" : ""}</td></tr>`).join("")}
      </table></div><p class="hint" style="margin-top:8px">탈퇴 요청이 오면 Supabase 대시보드 → Authentication → Users 에서 계정을 삭제하세요. 프로필·신청서·글은 함께 삭제됩니다.</p></div>`;
    el.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => { const a = apps.find(x => String(x.id) === b.dataset.doc); if (a) APPDOC.open(a, { email: a.email }); });
    el.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => { const { error } = await c.from("applications").update({ status: "approved" }).eq("id", b.dataset.ok); if (error) return alert(SB.errText(error)); buildSide(); members(el); });
    el.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => { const note = prompt("반려 사유 (신청인에게 보입니다)"); if (note === null) return; const { error } = await c.from("applications").update({ status: "rejected", review_note: note }).eq("id", b.dataset.no); if (error) return alert(SB.errText(error)); buildSide(); members(el); });
    el.querySelectorAll("[data-role]").forEach(s => s.onchange = async () => { const { error } = await c.from("profiles").update({ role: s.value }).eq("id", s.dataset.role); if (error) alert(SB.errText(error)); members(el); });
    el.querySelectorAll("[data-acc]").forEach(i => i.onchange = async () => { const { error } = await c.from("profiles").update({ can_accounting: i.checked }).eq("id", i.dataset.acc); if (error) alert(SB.errText(error)); members(el); });
  }

  /* ── 신고 처리 ── */
  async function reports(el) {
    const { data } = await c.from("reports").select("*").order("resolved").order("created_at", { ascending: false }).limit(100);
    const list = data || [];
    const cids = list.filter(r => r.target_type === "comment").map(r => r.target_id);
    const { data: cm } = cids.length ? await c.from("comments").select("id,post_id,body,is_hidden").in("id", cids) : { data: [] };
    const pids = list.filter(r => r.target_type === "post").map(r => r.target_id);
    const { data: ps } = pids.length ? await c.from("posts").select("id,title,is_hidden").in("id", pids) : { data: [] };
    el.innerHTML = `<h2>신고 처리</h2><p class="lead">게시판을 따로 관리하지 않더라도, 신고된 글은 확인해 숨기거나 삭제해야 합니다. 권리 침해 신고를 받고도 방치하면 운영자 책임이 생길 수 있습니다.</p>
      <div class="panel"><div class="tbl-wrap"><table><tr><th>접수</th><th>대상</th><th>사유</th><th>상태</th><th></th></tr>
      ${list.map(r => {
        const cmt = r.target_type === "comment" ? (cm || []).find(x => x.id === r.target_id) : null;
        const post = r.target_type === "post" ? (ps || []).find(x => x.id === r.target_id) : null;
        const pid = cmt ? cmt.post_id : r.target_id, hidden = (cmt || post)?.is_hidden;
        return `<tr><td>${fmt(r.created_at)}</td><td>${r.target_type === "post" ? "글" : "댓글"}: <a href="index.html#/board/view?id=${pid}" target="_blank" style="color:var(--brand);text-decoration:underline">${h(post ? post.title : cmt ? cmt.body.slice(0, 40) : "(삭제됨)")}</a>${hidden ? ' <span class="chip k">숨김</span>' : ""}</td>
          <td>${h(r.reason)}</td><td>${r.resolved ? '<span class="chip g">처리</span>' : '<span class="chip r">대기</span>'}</td>
          <td class="row">${(cmt || post) && !hidden ? `<button class="btn s danger" data-hide="${r.target_type}:${r.target_id}">숨김</button>` : ""}${!r.resolved ? `<button class="btn s w" data-res="${r.id}">처리 완료</button>` : ""}</td></tr>`;
      }).join("") || `<tr><td colspan="5" class="empty">신고가 없습니다.</td></tr>`}</table></div></div>`;
    el.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => { const [t, id] = b.dataset.hide.split(":"); await c.from(t === "post" ? "posts" : "comments").update({ is_hidden: true }).eq("id", id); reports(el); });
    el.querySelectorAll("[data-res]").forEach(b => b.onclick = async () => { await c.from("reports").update({ resolved: true }).eq("id", b.dataset.res); buildSide(); reports(el); });
  }

  /* ── 회계 장부 ── */
  let ledYear = new Date().getFullYear(), ledMonth = "", ledKind = "", ledCat = "", ledProj = "";
  async function ledger(el) {
    const from = `${ledYear}-${ledMonth || "01"}-01`;
    const to = ledMonth ? ymd(new Date(ledYear, +ledMonth, 0)) : `${ledYear}-12-31`;
    const { data, error } = await c.from("ledger").select("*").gte("tx_date", from).lte("tx_date", to).order("tx_date", { ascending: false }).order("id", { ascending: false });
    if (error) { el.innerHTML = `<h2>회계 장부</h2><p class="msg err">${h(SB.errText(error))}</p>`; return; }
    const all = data || [];
    /* 구분·항목·사업으로 걸러 보기 (예: 회비 수금 내역만) */
    const rows = all.filter(r => (!ledKind || r.kind === ledKind) && (!ledCat || r.category === ledCat) && (!ledProj || (r.project || "") === ledProj));
    const filtered = !!(ledKind || ledCat || ledProj);
    const catOpts = ledKind ? LEDGER_CATS[ledKind] : [...LEDGER_CATS["수입"], ...LEDGER_CATS["지출"]];
    const projs = [...new Set(all.map(r => r.project).filter(Boolean))];
    const sum = k => rows.filter(r => r.kind === k).reduce((s, r) => s + +r.amount, 0);
    const inc = sum("수입"), exp = sum("지출"), wh = rows.reduce((s, r) => s + +r.withholding, 0);
    const noRcpt = rows.filter(r => r.kind === "지출" && !r.receipt_path).length;
    el.innerHTML = `<h2>회계 장부</h2><p class="lead">관리자가 지정한 회계 담당자만 볼 수 있습니다. 모든 지출에는 영수증을 첨부하세요. 세금 판단은 세무사 확인을 권장합니다.</p>
      <div class="row" style="margin-bottom:12px"><select data-y style="width:auto">${[0, 1, 2].map(i => new Date().getFullYear() - i).map(y => `<option ${y === ledYear ? "selected" : ""}>${y}</option>`).join("")}</select>
        <select data-mo style="width:auto"><option value="">연간</option>${Array.from({ length: 12 }, (_, i) => pad(i + 1)).map(m => `<option value="${m}" ${m === ledMonth ? "selected" : ""}>${+m}월</option>`).join("")}</select>
        <select data-kind style="width:auto"><option value="">구분 전체</option>${["수입", "지출"].map(k => `<option ${k === ledKind ? "selected" : ""}>${k}</option>`).join("")}</select>
        <select data-cat style="width:auto"><option value="">항목 전체</option>${catOpts.map(k => `<option ${k === ledCat ? "selected" : ""}>${k}</option>`).join("")}</select>
        ${projs.length ? `<select data-proj style="width:auto"><option value="">사업 전체</option>${projs.map(k => `<option ${k === ledProj ? "selected" : ""}>${h(k)}</option>`).join("")}</select>` : ""}
        <button class="btn s w" data-dues>회비 수금 내역만</button>${filtered ? `<button class="btn s w" data-clear>걸러 보기 해제</button>` : ""}
        <button class="btn w" data-csv>${filtered ? "걸러 본 내역" : "전체"} 엑셀(CSV) 내려받기</button></div>
      ${filtered ? `<p class="msg ok" style="margin-bottom:12px">걸러 보는 중: ${[ledKind, ledCat, ledProj].filter(Boolean).map(h).join(" · ")} — ${rows.length}건, 합계 ${won(rows.reduce((s, r) => s + +r.amount, 0))}</p>` : ""}
      <div class="kpis"><div class="kpi good"><p>수입</p><b>${won(inc)}</b></div><div class="kpi"><p>지출</p><b>${won(exp)}</b></div>
        <div class="kpi"><p>차액</p><b>${won(inc - exp)}</b></div><div class="kpi"><p>원천징수 합계</p><b>${won(wh)}</b></div>
        <div class="kpi ${noRcpt ? "warn" : ""}"><p>영수증 없는 지출</p><b>${noRcpt}건</b></div></div>
      <div class="panel"><h3>거래 기록</h3>
        <form class="form" data-f>
          <div class="f2"><label>날짜<input type="date" name="tx_date" required value="${TODAY}"></label>
            <label>구분<select name="kind"><option>지출</option><option>수입</option></select></label>
            <label>금액(원)<input type="number" name="amount" min="1" required></label>
            <label>항목<select name="category"></select></label></div>
          <div class="f2"><label>사업 구분<input name="project" placeholder="자체 사업 / 공모사업명" list="projects"></label>
            <label>거래처<input name="counterparty"></label>
            <label>결제 수단<select name="method"><option>계좌이체</option><option>카드</option><option>현금</option><option>기타</option></select></label>
            <label>원천징수액(원)<input type="number" name="withholding" min="0" value="0"></label></div>
          <div class="row"><span class="hint">원천징수 계산:</span><button type="button" class="btn s w" data-wh="0.033">사업소득 3.3%</button><button type="button" class="btn s w" data-wh="0.088">기타소득 8.8%</button>
            <span class="hint">사례비는 받는 사람의 소득 구분에 따라 다릅니다. 지급한 달의 다음 달 10일까지 신고·납부합니다.</span></div>
          <label class="ck"><input type="checkbox" name="related_party"> 임원 본인·가족·관련 사업체와의 거래 (특수관계 거래)</label>
          <label data-appr hidden>의결 기록 <span class="hint">특수관계 거래는 회의 의결이 필요합니다. 예: 2026.10.05 운영회의 의결 (회의록 3호)</span><input name="approval_note"></label>
          <label>적요<input name="memo" maxlength="300"></label>
          <label>영수증·증빙 파일 <span class="hint">이미지 또는 PDF, 10MB 이하</span><input type="file" name="receipt" accept="image/*,.pdf"></label>
          <div class="row"><button class="btn">기록</button><span data-m></span></div>
          <datalist id="projects">${[...new Set(rows.map(r => r.project).filter(Boolean))].map(p => `<option>${h(p)}</option>`).join("")}</datalist>
        </form></div>
      <div class="panel"><h3>${ledYear}년 ${ledMonth ? +ledMonth + "월" : "전체"} · ${rows.length}건</h3><div class="tbl-wrap"><table>
        <tr><th>날짜</th><th>구분</th><th>항목</th><th>사업</th><th>거래처</th><th class="num">금액</th><th class="num">원천징수</th><th>증빙</th><th></th></tr>
        ${rows.map(r => `<tr><td>${fmt(r.tx_date)}</td><td><span class="chip ${r.kind === "수입" ? "g" : "k"}">${r.kind}</span>${r.related_party ? ' <span class="chip y" title="' + h(r.approval_note || "") + '">특수관계</span>' : ""}</td>
          <td>${h(r.category)}${r.memo ? `<br><span class="hint">${h(r.memo)}</span>` : ""}</td><td>${h(r.project || "")}</td><td>${h(r.counterparty || "")}</td>
          <td class="num">${won(r.amount)}</td><td class="num">${r.withholding ? won(r.withholding) : ""}</td>
          <td>${r.receipt_path ? `<button class="btn s w" data-rc="${h(r.receipt_path)}">보기</button>` : r.kind === "지출" ? '<span class="chip r">없음</span>' : ""}</td>
          <td><button class="btn s danger" data-del="${r.id}">삭제</button></td></tr>`).join("") || `<tr><td colspan="9" class="empty">기록이 없습니다.</td></tr>`}
      </table></div></div>`;
    const f = el.querySelector("[data-f]");
    const setCats = () => f.category.innerHTML = LEDGER_CATS[f.kind.value].map(x => `<option>${x}</option>`).join("");
    setCats(); f.kind.onchange = setCats;
    f.related_party.onchange = () => { el.querySelector("[data-appr]").hidden = !f.related_party.checked; f.approval_note.required = f.related_party.checked; };
    el.querySelectorAll("[data-wh]").forEach(b => b.onclick = () => { f.withholding.value = Math.floor((+f.amount.value || 0) * +b.dataset.wh / 10) * 10; });
    el.querySelector("[data-y]").onchange = e => { ledYear = +e.target.value; ledger(el); };
    el.querySelector("[data-mo]").onchange = e => { ledMonth = e.target.value; ledger(el); };
    el.querySelector("[data-kind]").onchange = e => { ledKind = e.target.value; if (ledKind && !LEDGER_CATS[ledKind].includes(ledCat)) ledCat = ""; ledger(el); };
    el.querySelector("[data-cat]").onchange = e => { ledCat = e.target.value; ledger(el); };
    const pj = el.querySelector("[data-proj]"); if (pj) pj.onchange = e => { ledProj = e.target.value; ledger(el); };
    el.querySelector("[data-dues]").onclick = () => { ledKind = "수입"; ledCat = "회비"; ledProj = ""; ledger(el); };
    const cl = el.querySelector("[data-clear]"); if (cl) cl.onclick = () => { ledKind = ledCat = ledProj = ""; ledger(el); };
    el.querySelector("[data-csv]").onclick = () => {
      const head = ["날짜", "구분", "항목", "사업", "거래처", "결제수단", "금액", "원천징수", "특수관계", "의결기록", "적요", "증빙"];
      const q = v => `"${String(v ?? "").replaceAll('"', '""')}"`;
      const csv = [head, ...rows.slice().reverse().map(r => [r.tx_date, r.kind, r.category, r.project, r.counterparty, r.method, r.amount, r.withholding, r.related_party ? "Y" : "", r.approval_note, r.memo, r.receipt_path ? "있음" : "없음"]), ...(filtered ? [[], ["합계", "", "", "", "", `${rows.length}건`, rows.reduce((t, r) => t + +r.amount, 0), rows.reduce((t, r) => t + +r.withholding, 0)]] : [])].map(r => r.map(q).join(",")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      const tag = [ledKind, ledCat, ledProj].filter(Boolean).join("_").replace(/[\\/:*?"<>|\s]+/g, "");
      a.download = `장부_${ledYear}${ledMonth ? "_" + ledMonth : ""}${tag ? "_" + tag : ""}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    };
    el.querySelectorAll("[data-rc]").forEach(b => b.onclick = async () => {
      const { data: s, error } = await c.storage.from("receipts").createSignedUrl(b.dataset.rc, 120);
      if (error) return alert(SB.errText(error)); window.open(s.signedUrl, "_blank", "noopener");
    });
    el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("이 거래 기록을 삭제할까요? 회계 기록은 가능하면 삭제하지 말고 반대 거래로 정정하세요.")) return;
      const r = rows.find(x => String(x.id) === b.dataset.del);
      await c.from("ledger").delete().eq("id", b.dataset.del);
      if (r?.receipt_path) await c.storage.from("receipts").remove([r.receipt_path]);
      ledger(el);
    });
    f.onsubmit = async e => {
      e.preventDefault();
      const m = el.querySelector("[data-m]"), btn = f.querySelector("button.btn:not(.w):not(.s)");
      btn.disabled = true;
      let receipt_path = null;
      const file = f.receipt.files[0];
      if (file) {
        if (file.size > 10 * 1024 * 1024) { btn.disabled = false; return msg(m, "파일이 10MB를 넘습니다."); }
        const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
        receipt_path = `${f.tx_date.value.slice(0, 7)}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const up = await c.storage.from("receipts").upload(receipt_path, file, { contentType: file.type || undefined });
        if (up.error) { btn.disabled = false; return msg(m, "영수증 업로드 실패: " + SB.errText(up.error)); }
      }
      const { error } = await c.from("ledger").insert({
        tx_date: f.tx_date.value, kind: f.kind.value, amount: +f.amount.value, category: f.category.value,
        project: f.project.value.trim() || null, counterparty: f.counterparty.value.trim() || null, method: f.method.value,
        withholding: +f.withholding.value || 0, related_party: f.related_party.checked, approval_note: f.approval_note.value.trim() || null,
        memo: f.memo.value.trim() || null, receipt_path,
      });
      btn.disabled = false;
      if (error) {
        if (receipt_path) await c.storage.from("receipts").remove([receipt_path]);
        return msg(m, /related_party/.test(error.message) ? "특수관계 거래는 의결 기록을 적어야 합니다." : SB.errText(error));
      }
      ledger(el);
    };
  }

  window.addEventListener("hashchange", () => { if (ME && (OFF || ACC)) { const v = location.hash.slice(1); const cur = document.querySelector('#side [aria-current="page"]')?.dataset.v; if (v && v !== cur) go(v); } });
  boot();
})();
</script>
</body>
</html>
